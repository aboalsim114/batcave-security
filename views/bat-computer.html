<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat-Ordinateur</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    >
  </head>
  <body class="bg-dark text-light">
    <main class="container py-5">
      <h1 class="h3">Bat-Ordinateur</h1>
      <p id="welcome">Chargement du profil...</p>
      <p>
        <a href="/auth/logout" class="btn btn-outline-light btn-sm">Se déconnecter</a>
      </p>

      <section class="mt-5">
        <h2 class="h4 mb-3">Arsenal</h2>
        <div id="arsenal" class="row g-3"></div>
      </section>

      <section class="card text-dark mt-4" style="max-width: 600px">
        <div class="card-body">
          <h2 class="h5">Note de mission</h2>
          <form id="report-form">
            <div class="mb-3">
              <label for="content" class="form-label">Rapport</label>
              <textarea
                id="content"
                name="content"
                class="form-control"
                rows="4"
                required
              ></textarea>
            </div>
            <button class="btn btn-primary" type="submit">
              Enregistrer le rapport
            </button>
          </form>
          <div id="report-message" class="alert mt-3 d-none" role="alert"></div>
        </div>
      </section>
    </main>

    <script src="/bat-computer.js"></script>
  </body>
</html>
