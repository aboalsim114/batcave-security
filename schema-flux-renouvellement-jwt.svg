<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1180" viewBox="0 0 1480 1180" role="img" aria-labelledby="titre desc">
  <title id="titre">Schema du flux de renouvellement JWT de la Batcave</title>
  <desc id="desc">Diagramme de sequence : login avec deux cookies, rejet 401, POST /refresh en arriere-plan, puis rejeu de la requete.</desc>

  <rect width="1480" height="1180" fill="#f7f4ea"/>

  <text x="740" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1b1b1b">TP3 - Cycle de vie accessToken / refreshToken</text>
  <text x="740" y="68" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#444">Navigateur, middleware, API Express et SQLite</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="70" y="88" width="220" height="52" rx="8" fill="#2d4a6f" stroke="#1b1b1b"/>
    <text x="180" y="120" fill="#fff">Navigateur / Frontend</text>

    <rect x="410" y="88" width="220" height="52" rx="8" fill="#6b3a2a" stroke="#1b1b1b"/>
    <text x="520" y="120" fill="#fff">Middleware</text>

    <rect x="750" y="88" width="220" height="52" rx="8" fill="#2f5d3a" stroke="#1b1b1b"/>
    <text x="860" y="120" fill="#fff">API / Express</text>

    <rect x="1090" y="88" width="220" height="52" rx="8" fill="#7a5b16" stroke="#1b1b1b"/>
    <text x="1200" y="120" fill="#fff">SQLite</text>
  </g>

  <g stroke="#888" stroke-dasharray="6 6" stroke-width="2">
    <line x1="180" y1="140" x2="180" y2="1080"/>
    <line x1="520" y1="140" x2="520" y2="1080"/>
    <line x1="860" y1="140" x2="860" y2="1080"/>
    <line x1="1200" y1="140" x2="1200" y2="1080"/>
  </g>

  <defs>
    <marker id="fleche" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1b1b1b"/>
    </marker>
    <marker id="flecheRouge" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#a31f1f"/>
    </marker>
    <marker id="flecheVerte" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1f6b3a"/>
    </marker>
  </defs>

  <rect x="24" y="168" width="1432" height="250" rx="10" fill="#dce8f5" opacity="0.55"/>
  <text x="40" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2d4a6f">1. Connexion : POST /login depose 2 cookies</text>

  <line x1="180" y1="220" x2="860" y2="220" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="520" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">POST /login (identifiant + mot de passe)</text>

  <rect x="760" y="236" width="200" height="58" rx="6" fill="#e8f5ec" stroke="#2f5d3a"/>
  <text x="860" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Genere accessToken JWT (15 s)</text>
  <text x="860" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">et refreshToken opaque (7 jours)</text>

  <line x1="860" y1="316" x2="1200" y2="316" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="1030" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">INSERT refreshToken</text>

  <line x1="1200" y1="352" x2="860" y2="352" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="1030" y="344" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Ligne enregistree</text>

  <line x1="860" y1="392" x2="180" y2="392" stroke="#1f6b3a" stroke-width="2" marker-end="url(#flecheVerte)"/>
  <text x="520" y="384" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f6b3a">Set-Cookie token + Set-Cookie refreshToken</text>

  <rect x="24" y="430" width="1432" height="190" rx="10" fill="#f6dede" opacity="0.5"/>
  <text x="40" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#a31f1f">2. AccessToken expire : le middleware repond 401</text>

  <line x1="180" y1="492" x2="520" y2="492" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="350" y="484" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Requete protegee (cookie token expire)</text>

  <rect x="420" y="508" width="200" height="40" rx="6" fill="#fde8e8" stroke="#a31f1f"/>
  <text x="520" y="534" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">JWT expire ou absent</text>

  <line x1="520" y1="576" x2="180" y2="576" stroke="#a31f1f" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#flecheRouge)"/>
  <text x="350" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#a31f1f">401 Unauthorized</text>

  <rect x="24" y="632" width="1432" height="250" rx="10" fill="#e6f3ea" opacity="0.55"/>
  <text x="40" y="656" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f5d3a">3. Refresh automatique : POST /refresh en arriere-plan</text>

  <line x1="180" y1="688" x2="860" y2="688" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="520" y="680" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">POST /refresh (cookie refreshToken, sans mot de passe)</text>

  <line x1="860" y1="728" x2="1200" y2="728" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="1030" y="720" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">SELECT refreshToken</text>

  <line x1="1200" y1="768" x2="860" y2="768" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="1030" y="760" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Jeton trouve et encore valide</text>

  <rect x="760" y="788" width="200" height="40" rx="6" fill="#e8f5ec" stroke="#2f5d3a"/>
  <text x="860" y="814" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Nouveau accessToken (15 s)</text>

  <line x1="860" y1="854" x2="180" y2="854" stroke="#1f6b3a" stroke-width="2" marker-end="url(#flecheVerte)"/>
  <text x="520" y="846" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f6b3a">Set-Cookie token (refreshToken inchange)</text>

  <rect x="24" y="894" width="1432" height="176" rx="10" fill="#efe6c8" opacity="0.55"/>
  <text x="40" y="918" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7a5b16">4. Rejeu transparent de la requete initiale</text>

  <line x1="180" y1="952" x2="520" y2="952" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="350" y="944" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Meme requete rejouee avec le nouveau token</text>

  <rect x="420" y="968" width="200" height="36" rx="6" fill="#e8f5ec" stroke="#2f5d3a"/>
  <text x="520" y="992" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12">Token valide : on laisse passer</text>

  <line x1="520" y1="1024" x2="860" y2="1024" stroke="#1b1b1b" stroke-width="2" marker-end="url(#fleche)"/>
  <text x="690" y="1016" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13">Requete transmise a l'API</text>

  <line x1="860" y1="1060" x2="180" y2="1060" stroke="#1f6b3a" stroke-width="2" marker-end="url(#flecheVerte)"/>
  <text x="520" y="1052" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f6b3a">200 + donnees (Batman reste connecte)</text>

  <text x="740" y="1154" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#444">Si POST /refresh echoue (refreshToken expire ou supprime), le frontend renvoie vers la page de connexion.</text>
</svg>
